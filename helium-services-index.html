<h1>Helium services</h1>
<p>This host serves the self-hosted Helium endpoints. Set
<code>helium.services.origin_override</code> to this origin.</p>
<ul>
<li><a href="/bangs.json">/bangs.json</a></li>
<li><a href="/dict/">/dict/</a> (empty until the dictionary timer has run)</li>
<li>/ext/ extension downloads</li>
<li>/com component updates</li>
<li>/ubo/ filter lists (clients must accept brotli)</li>
</ul>
</body>
