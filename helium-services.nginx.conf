# Helium services site. This file is not enabled.
# Link it from /etc/nginx/sites-enabled/ after setting server_name to the
# host in /etc/helium-services/helium-services.env (SERVICES_HOSTNAME).
# In Helium, set helium.services.origin_override to that origin.

server {
	listen 80;
	listen [::]:80;
	server_name helium-services.*;

	client_max_body_size 64k;

	root /srv/www/helium-services/htdocs;
	index index.html;

	location = /robots.txt {
		default_type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	location = /bangs.json {
		root /srv/www/helium-services/bangs;
		add_header Cache-Control "public, max-age=86400, stale-if-error=604800" always;
		add_header Access-Control-Allow-Origin * always;
	}

	location = /connectivitycheck {
		return 204;
	}

	# URI /dict/file is /srv/www/helium-services/dict/file.
	# gzip_static always serves the .gz sibling. The plain file remains
	# for clients that do not accept gzip.
	location /dict {
		gzip_static always;
		root /srv/www/helium-services;
		autoindex on;
	}

	location = /ext/proxy {
		proxy_pass http://127.0.0.1:8091/proxy;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding $http_accept_encoding;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}

	location /ext/ {
		proxy_pass http://127.0.0.1:8091/;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding $http_accept_encoding;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}

	location /com {
		proxy_pass http://127.0.0.1:8091/com;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding $http_accept_encoding;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}

	location /ubo/ {
		# The upstream body is already brotli. Do not compress it again,
		# and do not strip the browser's Accept-Encoding: the service
		# refuses requests that do not accept brotli.
		gzip off;
		brotli off;
		proxy_pass http://127.0.0.1:8092/;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_pass_request_body off;
		proxy_set_header Host $host;
		proxy_set_header Accept-Encoding $http_accept_encoding;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}
}
