# Helium services virtual host. This file is not included.
# Set ServerName to the host in /etc/helium-services/helium-services.env,
# then link this file from /etc/httpd/conf/webapps.d/ and reload httpd.
# In Helium, set helium.services.origin_override to that origin.
#
# If this is the only VirtualHost on port 80, Apache uses it as the
# default site. Give the machine another default vhost first when this
# host also serves other names.

<VirtualHost *:80>
	ServerName helium-services.invalid

	DocumentRoot /srv/www/helium-services/htdocs

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyTimeout 300

	<Directory /srv/www/helium-services/htdocs>
		Require all granted
		DirectoryIndex index.html
	</Directory>

	<Directory /srv/www/helium-services/bangs>
		Require all granted
	</Directory>

	<Directory /srv/www/helium-services/dict>
		Options +Indexes
		Require all granted
	</Directory>

	RewriteEngine On
	RewriteRule ^/connectivitycheck$ - [R=204,L]

	Alias /bangs.json /srv/www/helium-services/bangs/bangs.json
	Alias /dict /srv/www/helium-services/dict

	<Location /bangs.json>
		Header set Cache-Control "public, max-age=86400, stale-if-error=604800"
		Header set Access-Control-Allow-Origin "*"
	</Location>

	# Longer prefixes first. /ext/proxy must win over /ext/.
	ProxyPass /ext/proxy http://127.0.0.1:8091/proxy
	ProxyPassReverse /ext/proxy http://127.0.0.1:8091/proxy
	ProxyPass /ext/ http://127.0.0.1:8091/
	ProxyPassReverse /ext/ http://127.0.0.1:8091/
	ProxyPass /com http://127.0.0.1:8091/com
	ProxyPassReverse /com http://127.0.0.1:8091/com
	ProxyPass /ubo/ http://127.0.0.1:8092/
	ProxyPassReverse /ubo/ http://127.0.0.1:8092/
</VirtualHost>
